services:
  postgres:
    image: postgres:17
    container_name: agro-tech-care-postgres
    environment:
      POSTGRES_DB: db_agrotechcare
      POSTGRES_USER: user_agrotechcare
      POSTGRES_PASSWORD: pwd_agrotechcare
    ports:
      - "45432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
