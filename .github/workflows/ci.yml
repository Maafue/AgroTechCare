name: Build and publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  runs-on: ubuntu-latest
  steps:
    - name: Download repository
      uses: actions/checkout@v6

    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
    - name: Build and test application
      run: ./mvnw -B verify